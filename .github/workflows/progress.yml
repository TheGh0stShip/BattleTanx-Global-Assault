name: decompilation progress

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate objdiff v2 report
        run: python3 tools/generate_decomp_report.py --output report.json
      - name: Upload decomp.dev report
        uses: actions/upload-artifact@v4
        with:
          name: us_report
          path: report.json
