name: BattleTanx Global Assault (USA)
sha1: 805248fb0a0ee694cad8d7dc927b631d860dd8cf

options:
  base_path: ../..
  target_path: baseroms/us/baserom.z64
  platform: n64
  compiler: IDO
  basename: battletanx_ga
  build_path: build/us
  asm_path: asm/us
  src_path: src
  asset_path: assets/extracted/us
  cache_path: .splache/us
  symbol_addrs_path: config/us/symbol_addrs.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.txt
  create_asm_dependencies: true
  # This ROM interleaves code and data. Auto-disassembling every word invents
  # false functions from embedded tables, so only typed seed boundaries are code.
  disassemble_all: false

segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  - name: main
    type: code
    start: 0x1000
    vram: 0x80071000
    subsegments:
      - [0x1000, asm, main_before_8007ADB0]
      - [0xADB0, c, code/unknown_8007ADB0]
      - [0xADC0, asm, main_8007ADC0_to_8007B020]
      - [0xB020, c, code/unknown_8007B020]
      - [0xB030, asm, main_8007B030_to_801029D0]
      - [0x929D0, c, libultra/os_ai_get_length]
      - [0x929E0, c, libultra/os_ai_get_status]
      - [0x929F0, asm, main_801029F0_to_801037B0]
      - [0x937B0, c, libultra/al_copy]
      - [0x93830, c, libultra/os_create_mesg_queue]
      - [0x93860, asm, main_80103860_to_801059B0]
      - [0x959B0, c, libultra/al_filter_new]
      - [0x959D0, asm, main_801059D0_to_80105AD0]
      - [0x95AD0, c, libultra/al_heap_init]
      - [0x95B10, asm, main_80105B10_to_8010D660]
      - [0x9D660, c, libultra/os_get_thread_pri]
      - [0x9D680, asm, main_8010D680_to_8010F6A0]
      - [0x9F6A0, c, libultra/os_dp_device_busy]
      - [0x9F6D0, asm, main_8010F6D0_to_8010FE90]
      - [0x9FE90, c, libultra/os_si_device_busy]
      - [0x9FEC0, asm, main_8010FEC0_to_80110490]
      - [0xA0490, c, libultra/os_sp_set_status]
      - [0xA04A0, asm, main_801104A0_to_80110540]
      - [0xA0540, c, libultra/os_sp_get_status]
      - [0xA0550, asm, main_after_80110540]

  # The first automatically loaded MiB contains the known executable code.
  # The remaining ROM is kept opaque until its asset/archive formats are mapped.
  - [0x101000]
