  compiler: IDO
  basename: battletanx_ga
  build_path: build/us
  asm_path: asm/us
  src_path: src
  asset_path: assets/extracted/us
  cache_path: .splache/us
  # Some game translation units end on four-byte boundaries; their original
  # link does not force every following input section to a 16-byte boundary.
  subalign: 4
  symbol_addrs_path: config/us/symbol_addrs.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.txt
  create_asm_dependencies: true
  # This ROM interleaves code and data. Auto-disassembling every word invents
  # false functions from embedded tables, so only typed seed boundaries are code.
  disassemble_all: false

