# signature-matched libultra/audio-library names (see STATUS.md rounds 9-14 for
# the full derivation, including the header-mapping bug rounds 10-12 found and
# fixed, and round 14's filtering of gap-guess artifacts out of this file).
#
# CAVEATS -- this is a first pass, not a verified split:
# - Sizes are gap-to-next-known-symbol, not confirmed function ends. Entries whose
#   gap-guessed body contained a j/jal targeting outside this segment (a strong
#   sign of absorbed RSP microcode, data, or an unfound real boundary) were pulled
#   out to syms/battletanx_ga_funcs_suspect.txt rather than trusted here -- 123
#   entries, see that file and STATUS.md round 14. The remaining 1321 are cleaner
#   but still not independently verified one by one.
# - Names ending in _text_XXXX (from n64sym) mark a signature match at an offset
#   *inside* a larger known function, not necessarily a real separate function
#   start -- kept as split points since spimdisasm treated them as valid resync
#   addresses, but verify before trusting the name/boundary at face value.
# - Un-named entries (func_XXXXXXXX) have no n64sym match; real function, unknown
#   purpose.
# - Only covers the first MB, which holds all the game's code (STATUS.md round
#   17: the remaining ~7MB of this 8MB ROM is assets).
# - Corrected by hand since wherever a merged or mis-sized function was found
#   (each fix is noted at its entry and in STATUS.md).

